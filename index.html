<!doctype html>
<html lang="es" class="pwa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja Diaria</title>
<meta name="theme-color" content="#03060D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html,body{margin:0;background:#03060D}html{-webkit-text-size-adjust:100%;touch-action:manipulation}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Figtree:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 520px), barra de pestañas de cristal abajo, fondo de tormenta azul con rayos. Estética única oscura a propósito. */
:root{
  color-scheme:dark;
  --bg:#04070E; --panel:#0A1528; --panel2:#0E1D36; --sunk:#071022;
  --fg:#E8F4FF; --muted:#8FA6C2; --dim:#55698A;
  --cyan:#43D6FF; --blue:#2F7BFF; --line:rgba(67,214,255,.28); --line2:rgba(67,214,255,.12);
  --good:#3BE8A4; --warn:#FFC34A; --bad:#FF4F70; --purple:#9C72FF; --gold:#FFC23D;
  --f-hl:"Exo 2","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sys:"Rajdhani","Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{color:var(--fg);font:15px/1.5 var(--f-body);
  background:
   radial-gradient(900px 520px at 0% -8%,rgba(47,123,255,.30),transparent 62%),
   radial-gradient(640px 420px at 110% 28%,rgba(67,214,255,.14),transparent 62%),
   radial-gradient(760px 520px at 40% 115%,rgba(47,123,255,.24),transparent 62%),
   var(--bg)}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.screen{display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hl{font-family:var(--f-hl);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;margin:0;text-wrap:balance}
.hl.xl{font-size:2.3rem}.hl.l{font-size:1.7rem}.hl.m{font-size:1.25rem}.hl.s{font-size:1rem}
.c{background:linear-gradient(90deg,#5EE1FF,#2F7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.sys{font-family:var(--f-sys);font-weight:700;letter-spacing:.06em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.panel{position:relative;background:linear-gradient(180deg,rgba(16,34,64,.82),rgba(7,15,30,.92));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 0 26px rgba(47,123,255,.16),inset 0 1px 0 rgba(255,255,255,.05);min-width:0}
.panel.glow{border-color:rgba(67,214,255,.6);box-shadow:0 0 30px rgba(67,214,255,.28),inset 0 0 30px rgba(67,214,255,.06)}
.panel.alert{border-color:rgba(255,79,112,.7);box-shadow:0 0 28px rgba(255,79,112,.25)}
.stack{display:flex;flex-direction:column;gap:12px}
/* Ventana del sistema */
.win{position:relative;background:rgba(6,16,34,.9);border:1px solid rgba(67,214,255,.55);padding:16px;box-shadow:0 0 22px rgba(67,214,255,.25),inset 0 0 26px rgba(67,214,255,.08);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.win-h{display:flex;align-items:center;gap:10px;font-family:var(--f-sys);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BFEFFF;border-bottom:1px solid rgba(67,214,255,.3);padding-bottom:10px;margin-bottom:12px}
.win-h .ic{width:24px;height:24px;border:1.5px solid #BFEFFF;border-radius:4px;display:grid;place-items:center;font-size:.9rem}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 0,rgba(67,214,255,.08) 50%,transparent 100%);background-size:100% 6px;opacity:.35}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:rgba(10,24,48,.7);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#03101F;background:linear-gradient(90deg,#5EE1FF,#2F7BFF);box-shadow:0 0 22px rgba(67,214,255,.45)}
.btn.white{border:0;background:#F3F8FF;color:#071022}
.btn.danger{border-color:rgba(255,79,112,.6);color:#FFB3C1}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.85rem;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.link{background:none;border:0;padding:0;color:var(--cyan);font-weight:700;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-b:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chip{border:1px solid var(--line);background:rgba(10,24,48,.7);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--muted)}
.chip.sm{min-height:32px;padding:5px 11px;font-size:.8rem}
.chip[aria-pressed="true"]{color:#03101F;background:linear-gradient(90deg,#5EE1FF,#2F7BFF);border-color:transparent;box-shadow:0 0 14px rgba(67,214,255,.4)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.icon-b{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(10,24,48,.7);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-b svg{width:20px;height:20px}
input,select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
/* Hexágonos */
.hex{--hc:var(--cyan);position:relative;width:64px;aspect-ratio:1/1.1;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--hc);flex:none}
.hex::before{content:"";position:absolute;inset:2px;clip-path:inherit;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 38%,#071022),#060E1E 75%)}
.hex>*{position:relative}
.hex b{font-family:var(--f-hl);font-style:italic;font-weight:900;font-size:1.6rem;color:#fff;text-shadow:0 0 12px var(--hc)}
.hex.off{--hc:#24324A;opacity:.6}.hex.off b{color:#3B4C68;text-shadow:none}
.hex.big{width:110px}.hex.big b{font-size:3rem}
.hex.cur{filter:drop-shadow(0 0 12px var(--hc));animation:hexpulse 2.4s ease-in-out infinite}
@keyframes hexpulse{50%{filter:drop-shadow(0 0 22px var(--hc))}}
.hex svg{width:28px;height:28px}
/* Tarjeta jugador */
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.pcard .nm{font-family:var(--f-hl);font-style:italic;font-weight:900;font-size:1.25rem;text-transform:uppercase;line-height:1}
.xpbar{height:8px;border-radius:99px;background:rgba(67,214,255,.12);overflow:hidden;border:1px solid rgba(67,214,255,.25)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2F7BFF,#5EE1FF);box-shadow:0 0 12px #43D6FF;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.streak{display:flex;flex-direction:column;align-items:center;gap:0;color:var(--gold)}
.streak b{font-family:var(--f-hl);font-style:italic;font-weight:900;font-size:1.5rem;line-height:1}
.streak svg{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(255,140,40,.7));animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.08) rotate(-3deg)}}
/* Anillo */
.ringbox{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:168px;height:168px}
.ring svg{width:168px;height:168px;transform:rotate(-90deg);overflow:visible}
.ring .prog{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px currentColor)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-hl);font-style:italic;font-weight:900;font-size:2.4rem;line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:0;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* Barras de límites */
.lim{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.lim .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.lim .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lim .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tag.max{background:rgba(255,79,112,.14);color:#FF9DB0}.tag.min{background:rgba(59,232,164,.14);color:var(--good)}
/* Listas */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.item:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:rgba(67,214,255,.08);border:1px solid var(--line2);display:grid;place-items:center;color:var(--cyan)}
.thumb svg{width:22px;height:22px}
.item .t{min-width:0}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .t small{color:var(--muted)}
.item .k{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.item .k small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.empty{padding:12px 0;color:var(--muted);font-size:.9rem}
/* Ingredientes */
.ing{border:1px solid var(--line2);border-radius:16px;padding:12px;background:rgba(5,12,26,.6);display:flex;flex-direction:column;gap:10px;animation:enter .3s ease}
.ing-top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.ing-top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing-k{font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan)}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.step input{text-align:center;font-weight:800;font-size:1.1rem}
.step button{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(10,24,48,.8);font-size:1.3rem;font-weight:800;cursor:pointer}
.man{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.man input{min-height:38px;padding:6px 8px;font-size:.88rem}
.x{width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem}
/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(4,9,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line2)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--dim);cursor:pointer;transition:color .2s}
.tab svg{width:24px;height:24px;transition:filter .2s,transform .2s}
.tab[aria-current="page"]{color:var(--cyan)}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--cyan));transform:translateY(-2px)}
/* Modales */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.ov.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#0E1D36,#060E1E);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pop{width:100%;max-width:380px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.flash{position:fixed;inset:0;z-index:49;background:radial-gradient(circle,rgba(150,230,255,.9),rgba(67,214,255,.2) 50%,transparent 70%);pointer-events:none;animation:flashout .9s ease forwards}
@keyframes flashout{to{opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);width:max-content;animation:drop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.toast .win{padding:10px 14px;font-size:.9rem}
/* Juego: guerrero */
.saiyan{position:relative;overflow:hidden}
.stage{position:relative;height:240px;display:grid;place-items:center}
.aura{position:absolute;left:50%;bottom:6px;width:190px;height:230px;transform:translateX(-50%)}
.aura .glow{position:absolute;inset:0;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 65%,var(--aura) 0%,color-mix(in srgb,var(--aura) 40%,transparent) 40%,transparent 70%);filter:blur(6px);animation:pulse .5s ease-in-out infinite alternate}
.aura .fl{position:absolute;bottom:20px;width:46px;border-radius:50% 50% 40% 40%/80% 80% 20% 20%;background:linear-gradient(to top,var(--aura),transparent);opacity:.75;filter:blur(2px);animation:rise .9s ease-in infinite}
@keyframes pulse{from{transform:scale(.96);opacity:.8}to{transform:scale(1.04);opacity:1}}
@keyframes rise{0%{transform:translateY(10px) scaleY(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-60px) scaleY(1.2);opacity:0}}
.bolt{position:absolute;inset:0;animation:bflash 1.3s steps(1) infinite}.bolt svg{width:100%;height:100%}
@keyframes bflash{0%,70%{opacity:0}72%,78%{opacity:1}80%,88%{opacity:0}90%,93%{opacity:1}95%{opacity:0}}
.emblem{position:relative;z-index:2;text-align:center}
.emblem .form{font-family:var(--f-hl);font-style:italic;font-weight:900;text-transform:uppercase;font-size:1.7rem;line-height:1.05;color:#fff;text-shadow:0 0 12px var(--aura),0 0 26px var(--aura)}
.forms{display:flex;flex-direction:column;gap:6px}
.forms div{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.03);color:var(--dim)}
.forms div.on{color:var(--fg)}
.forms div.cur{background:color-mix(in srgb,var(--aura) 22%,transparent);color:#fff;font-weight:800}
.forms i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
/* Escenario de personaje */
.cstage{position:relative;height:340px;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 60%,color-mix(in srgb,var(--aura) 14%,transparent),transparent 70%)}
.cstage canvas{position:absolute;inset:0;width:100%;height:100%}
.cstage .char{position:relative;height:290px;width:auto;max-width:92%;animation:hover 1.8s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--aura))}
.cstage img.char{object-fit:contain}
.cstage.sm{height:250px}.cstage.sm .char{height:210px}
@keyframes hover{50%{transform:translateY(-7px)}}
.hair{transform-origin:100px 100px;animation:hairsway 2.2s ease-in-out infinite}
@keyframes hairsway{50%{transform:scale(1.015,1.03)}}
.eyeglow{animation:eyes 2.6s ease-in-out infinite}
@keyframes eyes{50%{opacity:.55}}
.pwa .app{padding-top:calc(14px + env(safe-area-inset-top,0px))}
/* Intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(600px 420px at 50% 45%,rgba(47,123,255,.35),transparent 70%),#03060D;transition:opacity .55s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro .in{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-inline:24px}
#intro .ring{position:absolute;width:140px;height:140px;border-radius:50%;border:2px solid #43D6FF;opacity:0;animation:burst 1.1s .35s ease-out forwards}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(4.5);opacity:0}}
#intro .ihex{animation:hexin .8s .15s cubic-bezier(.2,1.5,.4,1) both}
@keyframes hexin{from{transform:scale(0) rotate(-120deg);opacity:0}}
#intro .ititle{font-family:var(--f-hl);font-style:italic;font-weight:900;font-size:2.4rem;line-height:.95;text-transform:uppercase;animation:reveal .7s .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:translateX(-12px)}to{clip-path:inset(0 0 0 0)}}
#intro .iline{animation:fadeup .5s 1.05s ease both;max-width:300px}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
#intro .iflash{position:absolute;inset:0;background:#BFEFFF;opacity:0;animation:iflash .5s .3s ease-out}
@keyframes iflash{0%{opacity:.7}100%{opacity:0}}
/* Logros */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.ach>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.ach .hex{width:72px}
.ach .on{color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.scroll{overflow-x:auto}
.q{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-sys);font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.q .ok{color:var(--good)}.q .no{color:var(--muted)}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.check:first-child{border-top:0}
.check .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.check[aria-pressed="true"] .bx{background:var(--good);border-color:var(--good);color:#03101F;box-shadow:0 0 12px rgba(59,232,164,.5)}
.check[aria-pressed="true"] span:last-child{color:var(--muted);text-decoration:line-through}
.dlim{display:grid;grid-template-columns:auto 1fr 88px 92px;gap:8px;align-items:center}
.dlim input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:#43D6FF}
.dlim select,.dlim input{min-height:40px;padding:6px 8px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.74rem;font-weight:800}
.pill.good{background:rgba(59,232,164,.15);color:var(--good)}.pill.bad{background:rgba(255,79,112,.15);color:#FF9DB0}.pill.cy{background:rgba(67,214,255,.14);color:var(--cyan)}
@media (max-width:400px){.ringbox{grid-template-columns:1fr;justify-items:center}.hl.xl{font-size:2rem}.dlim{grid-template-columns:auto 1fr 64px 78px;gap:6px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

/* ================= estado ================= */
const S = {
  mode:"local", col:null, loaded:false,
  profile:null, dieta:null, despensa:{items:[]}, platos:{items:[]}, days:{},
  view:"inicio", lastView:"", date:todayKey(), sub:"registrar",
  meal:null, wk:null, receta:null, modal:null, notices:[], confirm:null, q:{}, onb:0, imgs:{}, imgKey:null, pvG:null, pvH:null, galOpen:false
};
const LS = "forja-diaria-v2";

/* ================= nutrición y dieta ================= */
const BASE = [{k:"kcal",n:"Calorías",u:"kcal"},{k:"prot",n:"Proteína",u:"g"},{k:"carb",n:"Carbohidratos",u:"g"},{k:"grasa",n:"Grasas",u:"g"}];
const nutrients = () => BASE.concat((S.dieta && S.dieta.extras) || []);
const ACT = [{v:1.2,t:"Sedentaria · oficina"},{v:1.375,t:"Ligera · de pie a ratos"},{v:1.55,t:"Activa · trabajo de pie"},{v:1.725,t:"Muy activa · trabajo físico"}];
function calc(p){
  const bmr = 10*p.peso + 6.25*p.altura - 5*p.edad + (p.sexo === "h" ? 5 : -161);
  const tdee = bmr * p.actividad;
  let delta = p.objetivo === "perder" ? -p.ritmo*1100 : p.objetivo === "ganar" ? p.ritmo*1100 : 0;
  let target = tdee + delta, ajustado = false;
  const floor = Math.max(p.sexo === "h" ? 1500 : 1200, bmr);
  if (target < floor) { target = floor; ajustado = true; }
  const prot = p.peso * (p.objetivo === "perder" ? 2 : 1.8), grasa = p.peso * .8;
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), target:Math.round(target), ajustado,
    prot:Math.round(prot), grasa:Math.round(grasa), carb:Math.round(Math.max(0,(target - prot*4 - grasa*9)/4))};
}
function newDieta(p){
  const c = calc(p);
  return {kcalModo:"auto", kcalManual:c.target, extra:.5, extras:[], notas:"", reglas:[],
    limites:{kcal:{v:c.target,t:"max",on:true}, prot:{v:c.prot,t:"min",on:true}, carb:{v:c.carb,t:"max",on:true}, grasa:{v:c.grasa,t:"max",on:true}}};
}
const kcalBase = () => S.dieta.kcalModo === "manual" ? num(S.dieta.kcalManual) : calc(S.profile).target;
function limitOf(k, burn){
  const L = S.dieta.limites[k]; if (!L || !L.on) return null;
  let v = k === "kcal" ? kcalBase() : num(L.v);
  if (k === "kcal") v += (burn||0) * (S.dieta.extra ?? .5);
  return {v:Math.round(v), t:k === "kcal" ? "max" : L.t};
}
function itemN(it){
  if (it.manual) return it.n || {};
  const o = {}; const f = num(it.g) / 100;
  for (const k in (it.per100 || {})) o[k] = num(it.per100[k]) * f;
  return o;
}
function sumN(list){ const o = {}; for (const n of list) for (const k in n) o[k] = (o[k]||0) + num(n[k]); return o; }

  const t = {n:{}, burn:0, min:0, meals:0, wks:0, xp:0};
  if (!day) return t;

  t.meals = (day.comidas||[]).length;
  for (const w of day.entrenos||[]) { t.burn += w.kcal||0; t.min += w.minutos||0; t.wks++; t.xp += w.xp||0; }
  return t;
}

  return {...L, val, ok, pct: L.v ? val / L.v : 0};
}

  if (t.meals < 2) return false;
  for (const n of nutrients()) { const st = limitStatus(n.k, t.n[n.k]||0, t.burn); if (st && st.t === "max" && !st.ok) return false; }
  const rs = S.dieta.reglas || []; if (rs.length && !rs.every(r => day.reglas && day.reglas[r.id])) return false;
  return true;
}

/* ================= entreno ================= */
const INT = {suave:{t:"Suave",f:.8,m:.8}, moderada:{t:"Moderada",f:1.2,m:1}, intensa:{t:"Intensa",f:1.6,m:1.2}, maxima:{t:"Máxima",f:2,m:1.4}};
const MET = [
  {n:"Pesas / gimnasio",met:5,tipo:"fuerza"},{n:"Calistenia",met:6,tipo:"fuerza"},{n:"Correr",met:9.8,tipo:"cardio"},
  {n:"Caminar rápido",met:4.3,tipo:"cardio"},{n:"Cinta inclinada",met:6,tipo:"cardio"},{n:"Bicicleta / spinning",met:7.5,tipo:"cardio"},
  {n:"Elíptica",met:5,tipo:"cardio"},{n:"Remo",met:7,tipo:"cardio"},{n:"HIIT / circuito",met:8,tipo:"cardio"},
  {n:"Saltar a la comba",met:11,tipo:"cardio"},{n:"Natación",met:7,tipo:"cardio"},{n:"Fútbol",met:7,tipo:"deporte"},
  {n:"Baloncesto",met:6.5,tipo:"deporte"},{n:"Pádel / tenis",met:7,tipo:"deporte"},{n:"Boxeo / artes marciales",met:9,tipo:"deporte"},
  {n:"Baile",met:5,tipo:"deporte"},{n:"Escalada",met:8,tipo:"deporte"},{n:"Yoga / estiramientos",met:2.5,tipo:"flexibilidad"}
];
const kcalOf = (met, min) => Math.round(met * S.profile.peso * (min/60));
const xpWorkout = w => Math.round((w.minutos||0) * (INT[w.intensidad]?.f || 1.2) + (w.kcal||0) / 10);

/* ================= progreso ================= */
/* Curva: nivel 100 = 50.000 XP. Una hora de entreno intenso da ~150 XP y la dieta hasta 30 XP/día,
   así que 5 entrenos por semana son ~960 XP/semana: unas 52 semanas para el máximo. Exponente 2,2: los primeros niveles vuelan. */
const LMAX = 100, XPMAX = 50000, CURVE = 2.2;
const xpAt = L => L <= 1 ? 0 : Math.round(XPMAX * Math.pow((L - 1)/(LMAX - 1), CURVE));
function levelOf(xp){
  let L = 1; while (L < LMAX && xp >= xpAt(L + 1)) L++;
  if (L >= LMAX) return {L, into:1, need:1, max:true};
  return {L, into:xp - xpAt(L), need:xpAt(L + 1) - xpAt(L), max:false};
}
const RANKS = [{r:"E",min:1,c:"#7B8BA6"},{r:"D",min:8,c:"#9AA7BC"},{r:"C",min:18,c:"#4FC3A1"},{r:"B",min:32,c:"#E7B53C"},{r:"A",min:48,c:"#3BD08F"},{r:"S",min:65,c:"#5B6BFF"},{r:"SS",min:82,c:"#9C72FF"},{r:"SSS",min:100,c:"#FF4F70"}];
const rankOf = L => [...RANKS].reverse().find(x => L >= x.min);
const FORMS = [
  {n:"Humano",min:1,c:"#9AA3B5"},{n:"Saiyan",min:6,c:"#F2F2F2"},{n:"Super Saiyan",min:15,c:"#FFD23F"},
  {n:"Super Saiyan 2",min:28,c:"#FFE35A",rayos:true},{n:"Super Saiyan 3",min:40,c:"#FFBF1F",rayos:true},
  {n:"Super Saiyan God",min:55,c:"#FF3D63"},{n:"Super Saiyan Blue",min:70,c:"#2EC8FF"},
  {n:"Ultra Instinto · Presagio",min:85,c:"#B9CCFF"},{n:"Ultra Instinto",min:100,c:"#E9EEF7",rayos:true}
];
const formOf = L => [...FORMS].reverse().find(f => L >= f.min);
function progress(){
  const t0 = todayKey(), keys = Object.keys(S.days).sort();
  let xp = 0, okDays = 0, burned = 0, mins = 0, wcount = 0, meals = 0, maxStreak = 0, run = 0, prev = null;
  for (const k of keys) {
    const t = totals(S.days[k]);
    xp += t.xp + (t.min >= 30 ? 10 : 0); burned += t.burn; mins += t.min; wcount += t.wks; meals += t.meals;
    if (k < t0 && t.meals) xp += 5;
    if (k < t0 && dayOk(k)) { xp += 25; okDays++; }
    if (t.wks) { run = (prev && addDays(prev,1) === k) ? run + 1 : 1; prev = k; maxStreak = Math.max(maxStreak, run); }
  }
  let streak = 0, k = t0;
  if (!totals(S.days[k]).wks) k = addDays(k,-1);
  while (totals(S.days[k]).wks) { streak++; k = addDays(k,-1); }
  return {xp, ...levelOf(xp), okDays, burned, mins, wcount, meals, streak, maxStreak};
}
const ACH = [
  {id:"despertar",n:"Despertar",ic:"star",c:"#43D6FF",ok:()=>true},

/* ================= almacenamiento ================= */
/* Almacén del dispositivo: IndexedDB (cabe mucho más que localStorage, fotos incluidas) */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("forja", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode), q = fn(t.objectStore("kv")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {get:k => run("readonly", s => s.get(k)), set:(k, v) => run("readwrite", s => s.put(v, k)), del:k => run("readwrite", s => s.delete(k)), keys:() => run("readonly", s => s.getAllKeys())};
})();
function applyState(d){ S.profile = d.profile||null; S.dieta = d.dieta||null; S.despensa = d.despensa||{items:[]}; S.platos = d.platos||{items:[]}; S.days = d.days||{}; }
async function loadLocal(){
  let d = null;
  try { d = await IDB.get("state"); } catch {}
  if (!d) { try { d = JSON.parse(localStorage.getItem(LS) || "null"); } catch {} }
  if (d) applyState(d);
  try { for (const k of await IDB.keys()) if (String(k).startsWith("img-")) S.imgs[String(k).slice(4)] = await IDB.get(k); } catch {}
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LS + "-img-") && !S.imgs[k.slice((LS + "-img-").length)]) S.imgs[k.slice((LS + "-img-").length)] = localStorage.getItem(k); } } catch {}
}
let saveT = null;
function saveLocal(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const st = clone({profile:S.profile, dieta:S.dieta, despensa:S.despensa, platos:S.platos, days:S.days});
    IDB.set("state", st).catch(() => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch { notify("No se pudo guardar en el dispositivo.", "bad"); } });
  }, 250);
}
const saveImgLocal = (k, data) => (data == null ? IDB.del("img-" + k) : IDB.set("img-" + k, data)).catch(() => notify("No se pudo guardar la imagen.", "bad"));
function persist(id, data){
  if (S.mode !== "cloud") { saveLocal(); return; }
  const ref = S.col.doc(id);
  S.q[id] = (S.q[id] || Promise.resolve()).then(() => data == null ? ref.delete() : ref.set(data))
    .catch(e => notify(e && e.code === "quota_exceeded" ? "Espacio lleno: borra días antiguos." : "No se pudo guardar. Revisa tu conexión.", "bad"));
}
const saveDay = k => persist("d-" + k, S.days[k] ? clone(S.days[k]) : null);
const saveProfile = () => persist("profile", clone(S.profile));
const saveDieta = () => persist("dieta", clone(S.dieta));
const saveDespensa = () => persist("despensa", clone(S.despensa));
const savePlatos = () => persist("platos", clone(S.platos));
const dayDoc = k => S.days[k] || (S.days[k] = {fecha:k, comidas:[], entrenos:[], reglas:{}});

const INTRO_T0 = performance.now();
let introDone = false;
function introWelcome(){
  if (introDone) return; introDone = true;
  const el = $("#intro"); if (!el) return;
  if (S.profile && S.profile.accepted) {
    const p = progress(), rk = rankOf(p.L);
    $("#ihex").style.setProperty("--hc", rk.c); $("#ihex").innerHTML = `<b style="font-size:${rk.r.length > 2 ? "1.9rem" : rk.r.length > 1 ? "2.4rem" : "3rem"}">${rk.r}</b>`;
    $("#iwelcome").textContent = `Bienvenido de nuevo, ${S.profile.nombre || "Jugador"}. Nivel ${p.L}.`;
  } else $("#iwelcome").textContent = "Nuevo jugador detectado.";
  const wait = RM ? 300 : Math.max(0, 2300 - (performance.now() - INTRO_T0));
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 600); }, wait);
  if (!RM) setTimeout(() => bolt(true), 250);
}
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("#intro")) { const el = $("#intro"); el.classList.add("out"); setTimeout(() => el.remove(), 600); } }, true);
async function init(){
  let db = null, user = null, id = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch {}
    if (db && user) { try { id = await user.id(); } catch {} }
  }
  if (db && id) {
    S.mode = "cloud"; S.col = db.collection("data/users/" + id);
    S.col.onSnapshot(snap => {
      const days = {}, imgs = {}; let prof = null, dieta = null, desp = {items:[]}, plat = {items:[]};
      for (const d of snap.docs) {
        const v = clone(d.data());
        if (d.id === "profile") prof = v; else if (d.id === "dieta") dieta = v;
        else if (d.id === "despensa") desp = v; else if (d.id === "platos") plat = v;
        else if (d.id.startsWith("d-")) days[d.id.slice(2)] = v;
        else if (d.id.startsWith("img-")) imgs[d.id.slice(4)] = v.data;
      }
      Object.assign(S, {profile:prof, dieta:dieta || (prof ? newDieta(prof) : null), despensa:desp, platos:plat, days, imgs});
      S.loaded = true; render(true);
    }, () => { S.mode = "local"; loadLocal().then(() => { S.loaded = true; render(); }); });
  } else {
    await loadLocal(); S.loaded = true; render();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  }
}

/* ================= notificaciones ================= */
function notify(msg, kind){
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status");
  el.innerHTML = `<div class="win" style="${kind==="bad"?"border-color:rgba(255,79,112,.7)":""}"><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="sys" style="color:${kind==="bad"?"#FF9DB0":"var(--cyan)"}">[SISTEMA]</span><span>${esc(msg)}</span></div></div>`;
  document.body.appendChild(el); setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, 2600);
}
function snapshotProgress(){ const p = progress(); return {L:p.L, ach:ACH.filter(a => a.ok(p)).map(a => a.id)}; }
function afterChange(before){
  const now = snapshotProgress();
  if (now.L > before.L) S.notices.push({type:"level", from:before.L, to:now.L});
  for (const id of now.ach) if (!before.ach.includes(id)) S.notices.push({type:"ach", id});
  if (S.profile.lastLevel !== now.L) { S.profile.lastLevel = now.L; saveProfile(); }
  if (!S.modal && S.notices.length) S.modal = S.notices.shift();
}

/* ================= render ================= */
function renderTabs(){
  const show = !!S.profile && S.profile.accepted;
  $("#tabs").hidden = !show; if (!show) return;
  const tabs = [["inicio","Inicio",I.home],["comer","Comer",I.food],["entreno","Entreno",I.dumb],["nivel","Nivel",I.crown],["dieta","Mi dieta",I.scroll]];
  $("#tabsin").innerHTML = tabs.map(([v,t,i]) => `<button class="tab" data-act="nav" data-v="${v}" ${S.view===v?'aria-current="page"':''}>${i}<span>${t}</span></button>`).join("");
}
function render(fromSnap){
  if (!S.loaded) return;
  introWelcome();
  const ae = document.activeElement;
  if (fromSnap && ae && ae.matches && ae.matches("input,textarea,select") && ae.closest("#app,#layer")) { renderTabs(); return; }
  renderTabs();
  let v = S.view;
  if (!S.profile || !S.profile.accepted) v = "onb";
  const html = {onb:vOnb, inicio:vInicio, comer:vComer, entreno:vEntreno, nivel:vNivel, dieta:vDieta, perfil:vPerfil}[v]();
  const enter = S.lastView !== v + S.sub;
  $("#app").innerHTML = `<div class="screen ${enter && !RM ? "enter" : ""}">${html}</div>`;
  S.lastView = v + S.sub;
  renderLayer();
  postRender(enter);
}
function renderLayer(){
  const m = S.modal;
  if (!m) { $("#layer").innerHTML = ""; return; }
  $("#layer").innerHTML = {picker:mPicker, food:mFood, level:mLevel, ach:mAch, plato:mPlato}[m.type]();
  startAuras();
  if (m.type === "level" && !RM && !m.flashed) { m.flashed = true; const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f); setTimeout(() => f.remove(), 950); bolt(true); }
}
function postRender(enter){
  startAuras();
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, from = enter ? 0 : (+el.dataset.from || to);
    if (RM || from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), d = 900;
    const step = t => { const p = Math.min(1, (t - t0)/d), e = 1 - Math.pow(1-p, 3); el.textContent = fmt(from + (to-from)*e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll("[data-w]").forEach(el => { if (enter && !RM) { el.style.width = "0%"; requestAnimationFrame(() => requestAnimationFrame(() => el.style.width = el.dataset.w + "%")); } else el.style.width = el.dataset.w + "%"; });
  document.querySelectorAll(".prog[data-off]").forEach(el => { const C = +el.dataset.c; if (enter && !RM) { el.style.strokeDashoffset = C; requestAnimationFrame(() => requestAnimationFrame(() => el.style.strokeDashoffset = el.dataset.off)); } else el.style.strokeDashoffset = el.dataset.off; });
}

      <div class="xpbar"><i data-w="${(p.into/p.need*100).toFixed(1)}"></i></div></div>
    <div class="streak">${I.flame}<b class="num">${p.streak}</b><span class="lbl" style="color:var(--gold)">racha</span></div>
  </button>`;
}
function vInicio(){
  const k = S.date, day = S.days[k], t = totals(day), p = progress();
  const kc = limitStatus("kcal", t.n.kcal||0, t.burn) || {v:kcalBase(), val:t.n.kcal||0, ok:true, pct:0, t:"max"};
  const rest = kc.v - kc.val, over = rest < 0;
  const C = 2*Math.PI*70, pct = Math.min(1, kc.v ? kc.val/kc.v : 0);
  const col = over ? "var(--bad)" : pct > .9 ? "var(--warn)" : "var(--cyan)";
  const lims = nutrients().filter(n => n.k !== "kcal").map(n => limitStatus(n.k, t.n[n.k]||0, t.burn) && {...n, st:limitStatus(n.k, t.n[n.k]||0, t.burn)}).filter(Boolean);
  const broken = lims.filter(l => l.st.t === "max" && !l.st.ok);
  const meals = (day?.comidas||[]).slice().sort((a,b) => (a.hora||"").localeCompare(b.hora||""));
  const reglas = S.dieta.reglas || [];
  return `
  ${playerCard(p)}
  <div class="row between"><button class="icon-b" data-act="day" data-d="-1" aria-label="Día anterior">${I.left}</button>
    <div style="text-align:center"><h1 class="hl l">${esc(dayLabel(k))}</h1><div class="muted" style="font-size:.8rem">${esc(parseKey(k).toLocaleDateString("es-ES",{day:"numeric",month:"long"}))}</div></div>
    <button class="icon-b" data-act="day" data-d="1" aria-label="Día siguiente" ${k>=todayKey()?"disabled style='opacity:.3'":""}>${I.right}</button></div>
  <section class="panel ${over||broken.length?"alert":""}"><div class="ringbox">
    <div class="ring"><svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="70" fill="none" stroke="rgba(67,214,255,.1)" stroke-width="14"/>
      <circle class="prog" cx="84" cy="84" r="70" fill="none" stroke="${col}" style="color:${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" data-c="${C}" data-off="${C*(1-pct)}"/></svg>
      <div class="ctr"><span class="lbl" style="color:${over?"#FF9DB0":"var(--muted)"}">${over?"Te pasaste":"Te quedan"}</span><span class="big num" data-count="${Math.abs(Math.round(rest))}">0</span><span class="muted" style="font-size:.8rem">kcal</span></div></div>
    <dl class="kv"><dt>Base de tu dieta</dt><dd>${fmt(kcalBase())}</dd>
      <dt>Entreno (+${Math.round((S.dieta.extra??.5)*100)}%)</dt><dd style="color:var(--cyan)">+${fmt(t.burn*(S.dieta.extra??.5))}</dd>
      <dt style="color:var(--fg);font-weight:700">Máximo hoy</dt><dd>${fmt(kc.v)}</dd>
      <dt>Comido</dt><dd>${fmt(kc.val)}</dd><dt>Quemado</dt><dd>${fmt(t.burn)}</dd></dl>
  </div></section>
  ${broken.length ? `<div class="win" style="border-color:rgba(255,79,112,.7)"><div class="win-h" style="color:#FF9DB0;border-color:rgba(255,79,112,.35)"><span class="ic" style="border-color:#FF9DB0">!</span>Advertencia</div>
    <p style="margin:0">Has superado tu límite de ${broken.map(b => esc(b.n.toLowerCase())).join(", ")}.</p></div>` : ""}
  ${lims.length ? `<section class="panel stack"><div class="row between"><h2 class="hl m">Límites de hoy</h2><button class="link" data-act="nav" data-v="dieta">Editar</button></div>
    ${lims.map(l => { const st = l.st, w = Math.min(100, st.pct*100);
      const c = st.t === "max" ? (st.ok ? (st.pct > .9 ? "var(--warn)" : "var(--cyan)") : "var(--bad)") : (st.ok ? "var(--good)" : "var(--blue)");
      return `<div class="lim"><span>${esc(l.n)} <span class="tag ${st.t}">${st.t}</span></span><div class="tr"><i data-w="${w.toFixed(1)}" style="background:${c};box-shadow:0 0 10px ${c}"></i></div><span class="v">${f1(st.val)} / ${fmt(st.v)} ${esc(l.u)}</span></div>`; }).join("")}
  </section>` : ""}
  ${reglas.length ? `<section class="panel"><h2 class="hl m" style="margin-bottom:6px">Reglas de mi dieta</h2>
    ${reglas.map(r => { const on = !!(day && day.reglas && day.reglas[r.id]); return `<button class="check" data-act="regla" data-id="${r.id}" aria-pressed="${on}"><span class="bx">${on?"✓":""}</span><span>${esc(r.t)}</span></button>`; }).join("")}</section>` : ""}
  <section class="panel"><div class="row between"><h2 class="hl m">Comidas</h2><button class="btn sm pri" data-act="nav" data-v="comer">${I.plus} Añadir</button></div>
    <div class="list" style="margin-top:6px">${meals.length ? meals.map(itemMeal).join("") : `<p class="empty">Nada registrado este día.</p>`}</div></section>
  <section class="panel"><div class="row between"><h2 class="hl m">Entrenos</h2><button class="btn sm" data-act="nav" data-v="entreno">${I.plus} Añadir</button></div>

}

function ingRow(it){
  if (it.manual) {
    return `<div class="ing" data-u="${it.u}"><div class="ing-top"><input data-mname="${it.u}" value="${esc(it.nombre)}" placeholder="Qué comiste (p. ej. menú del día)" style="min-height:38px"><span></span><button class="x" data-act="rmitem" data-u="${it.u}" aria-label="Quitar">×</button></div>
      <div class="man">${nutrients().map(n => `<label class="field"><span class="lbl" style="font-size:.6rem">${esc(n.n.slice(0,9))} (${esc(n.u)})</span><input inputmode="decimal" data-mn="${it.u}" data-k="${n.k}" value="${it.n[n.k] ? esc(r1(it.n[n.k])) : ""}"></label>`).join("")}</div></div>`;
  }
  const n = itemN(it), uni = it.unidad || "g";
  return `<div class="ing" data-u="${it.u}">
    <div class="ing-top"><b>${esc(it.nombre)}</b><span class="ing-k" id="k-${it.u}">${fmt(n.kcal)} kcal</span><button class="x" data-act="rmitem" data-u="${it.u}" aria-label="Quitar">×</button></div>

    ${(it.porciones||[]).length ? `<div class="chips">${it.porciones.map(p => `<button class="chip sm" data-act="por" data-u="${it.u}" data-g="${p.g}">${esc(p.n)} · ${f1(p.g)} ${uni}</button>`).join("")}</div>` : ""}
    <div class="muted" style="font-size:.78rem" id="m-${it.u}">${macroLine(n)}</div></div>`;
}
const macroLine = n => `P ${f1(n.prot)} g · C ${f1(n.carb)} g · G ${f1(n.grasa)} g` + ((S.dieta.extras||[]).map(x => ` · ${esc(x.n)} ${f1(n[x.k])} ${esc(x.u)}`).join(""));
function mealTotHtml(){
  const m = S.meal, tot = sumN(m.items.map(itemN));
  const day = S.days[S.date], t = totals(day);
  const after = sumN([t.n, tot]);
  const kc = limitOf("kcal", t.burn);
  const warns = nutrients().map(n => { const st = limitStatus(n.k, after[n.k]||0, t.burn); return st && st.t === "max" && !st.ok ? `${n.n} (${f1(st.val)} / ${fmt(st.v)} ${n.u})` : null; }).filter(Boolean);
  return `<div class="row between"><span class="lbl">Total de esta comida</span><span class="hl l num" style="color:var(--cyan)">${fmt(tot.kcal)} <span style="font-size:.9rem">kcal</span></span></div>
   <div class="muted" style="font-size:.85rem">${macroLine(tot)}</div>
   ${kc ? `<div class="row between" style="font-size:.9rem"><span>Después te quedarán</span><b class="num" style="color:${kc.v - (after.kcal||0) < 0 ? "var(--bad)" : "var(--good)"}">${fmt(kc.v - (after.kcal||0))} kcal</b></div>` : ""}
   ${warns.length ? `<div class="pill bad" style="white-space:normal;border-radius:10px;padding:6px 10px">Con esta comida te pasas en: ${esc(warns.join(", "))}</div>` : ""}`;

const inRecipe = () => S.view === "comer" && S.sub === "recetas" && !!S.receta;
const tgt = () => inRecipe() ? S.receta : (S.meal || (S.meal = newMeal()));
function refreshMeal(u){
  const it = tgt().items.find(x => x.u === u);
  if (it && !it.manual) { const n = itemN(it); const k = document.getElementById("k-"+u); if (k) k.textContent = fmt(n.kcal) + " kcal"; const mm = document.getElementById("m-"+u); if (mm) mm.innerHTML = macroLine(n); }
  if (inRecipe()) { const r = $("#recTot"); if (r) r.innerHTML = recTotHtml(); return; }
  const tEl = $("#mealTot"); if (tEl) tEl.innerHTML = mealTotHtml();
}
function addFoodToMeal(f, g){
  f.usos = (f.usos||0) + 1;
  tgt().items.push({u:uid(), foodId:f.id, nombre:f.nombre, unidad:f.unidad||"g", per100:clone(f.per100), porciones:clone(f.porciones||[]), g: g ?? (f.porciones && f.porciones[0] ? f.porciones[0].g : 100)});
}
function saveMeal(){
  const m = S.meal; if (!m || !m.items.length) return;
  const items = m.items.filter(it => it.manual ? (it.nombre || num(it.n.kcal)) : num(it.g) > 0);
  if (!items.length) { notify("Pon una cantidad mayor que cero.", "bad"); return; }
  const before = snapshotProgress();
  const tot = sumN(items.map(itemN)); for (const k in tot) tot[k] = r1(tot[k]);
  const nombre = items.map(i => i.nombre || "Comida").join(", ");
  dayDoc(S.date).comidas.push({id:uid(), hora:nowHM(), tipo:m.tipo, nombre: m.savePlato && m.platoNombre ? m.platoNombre : nombre, thumb:m.thumb||null,
    items:items.map(i => ({nombre:i.nombre||"Comida", foodId:i.foodId||null, g:i.manual?null:r1(i.g), unidad:i.unidad||null, n:Object.fromEntries(Object.entries(itemN(i)).map(([k,v]) => [k, r1(v)]))})), tot});
  saveDay(S.date);
  if (m.savePlato) {
    const nm = (m.platoNombre || nombre).slice(0,60);
    S.platos.items.unshift({id:uid(), nombre:nm, ings:items.map(i => i.manual ? {manual:true, nombre:i.nombre, n:clone(i.n)} : {foodId:i.foodId, g:r1(i.g)})});
    savePlatos();
  }
  if (items.some(i => i.foodId)) saveDespensa();
  S.meal = null; S.view = "inicio"; S.sub = "registrar";
  notify(`Comida guardada · ${fmt(tot.kcal)} kcal`);
  afterChange(before); render();
}

function vInforme(p){
  const t0 = todayKey(), base = calc(S.profile);

  const logged = rows.filter(r => r.t.meals);
  const avg = logged.length ? logged.reduce((a,r) => a + (r.t.n.kcal||0), 0)/logged.length : 0;
  const bal = logged.reduce((a,r) => a + (r.t.n.kcal||0) - (base.tdee + r.t.burn), 0);
  const max = Math.max(1, ...rows.map(r => Math.max(r.t.n.kcal||0, r.lim)));
  const W = 320, H = 150, bw = 26, gap = (W - 7*bw)/7;
  const bars = rows.map((r,i) => { const x = gap/2 + i*(bw+gap), v = r.t.n.kcal||0, h = v/max*(H-34), ly = H-20 - r.lim/max*(H-34);

    <text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="#8FA6C2">${esc(parseKey(r.k).toLocaleDateString("es-ES",{weekday:"narrow"}))}</text>`; }).join("");

   <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Calorías comidas por día frente a tu máximo">${bars}</svg>
   <p class="muted" style="margin:0;font-size:.78rem">Barra: lo que comiste. Raya blanca: tu máximo de ese día.</p>
   <div class="scroll"><table class="tbl"><thead><tr><th>Día</th><th>Comido</th><th>Máximo</th><th>Quemado</th><th>Margen</th></tr></thead><tbody>
   ${rows.slice().reverse().map(r => { const v = r.t.n.kcal||0, m = r.lim - v; return `<tr><td>${esc(dayLabel(r.k))}</td><td>${r.t.meals?fmt(v):"—"}</td><td>${fmt(r.lim)}</td><td>${fmt(r.t.burn)}</td><td style="color:${!r.t.meals?"var(--dim)":m<0?"var(--bad)":"var(--good)"}">${r.t.meals?(m>0?"+":"")+fmt(m):"—"}</td></tr>`; }).join("")}
   </tbody></table></div>
   <dl class="kv"><dt>Media diaria (días registrados)</dt><dd>${fmt(avg)} kcal</dd><dt>Balance de la semana</dt><dd>${bal>0?"+":""}${fmt(bal)} kcal</dd><dt>Cambio de peso estimado</dt><dd>${bal>0?"+":""}${f1(bal/7700)} kg</dd></dl></section>
  ${pesos.length ? `<section class="panel"><h2 class="hl m">Peso</h2><dl class="kv" style="margin-top:10px">${pesos.map(x => `<dt>${esc(dayLabel(x.fecha))}</dt><dd>${f1(x.kg)} kg</dd>`).join("")}</dl></section>` : ""}`;

function readProfile(){

    edad:Math.round(num(g("p-edad").value)), altura:Math.round(num(g("p-altura").value)), peso:r1(num(g("p-peso").value)),

  if (p.edad < 14 || p.edad > 100 || p.altura < 120 || p.altura > 230 || p.peso < 35 || p.peso > 300) return null;
  const pesos = (old.pesos||[]).slice(), k = todayKey(), last = pesos[pesos.length-1];
  if (!last || last.kg !== p.peso) { if (last && last.fecha === k) last.kg = p.peso; else pesos.push({fecha:k, kg:p.peso}); }
  p.pesos = pesos.slice(-90);
  return p;
}

async function exportData(){

  const filename = `forja-copia-${todayKey()}.json`;
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await claude.use("downloads").catch(() => null);
    if (!dl) { notify("Aquí no se pueden guardar archivos.", "bad"); return; }
    try { await dl.save({filename, data:new Blob([data], {type:"application/json"})}); notify("Copia guardada"); }
    catch (e) { if (!e || e.code !== "declined") notify("No se pudo guardar la copia.", "bad"); }
    return;
  }
  const file = new File([data], filename, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Copia de Forja Diaria"}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function readBackup(file){
  if (!file) return;

    const d = JSON.parse(await file.text());
    if (!d || d.app !== "forja-diaria") throw 0;
    S.pendingImport = d; render();
  } catch { notify("Ese archivo no es una copia de Forja Diaria.", "bad"); }
}
function applyBackup(){

    Object.keys(S.imgs).forEach(k => { if (!d.imgs || !d.imgs[k]) persist("img-" + k, null); });
  } else Object.keys(S.imgs).forEach(k => { if (!d.imgs || !d.imgs[k]) saveImgLocal(k, null); });

    Object.keys(S.days).forEach(saveDay); Object.entries(S.imgs).forEach(([k, v]) => persist("img-" + k, {data:v}));
  } else { saveLocal(); Object.entries(S.imgs).forEach(([k, v]) => saveImgLocal(k, v)); }

}

    let max = 420, data = "";
    for (let tries = 0; tries < 4; tries++) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth*s); cv.height = Math.round(img.naturalHeight*s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      data = cv.toDataURL("image/webp", .85); if (!data.startsWith("data:image/webp")) data = cv.toDataURL("image/png");
      if (data.length < 200000) break; max = Math.round(max*.75);
    }
    S.imgs[key] = data;
    if (S.mode === "cloud") persist("img-" + key, {data}); else saveImgLocal(key, data);
    notify("Imagen guardada"); render();
  } catch { notify("No pude abrir esa imagen.", "bad"); } finally { URL.revokeObjectURL(url); }
}

/* ================= fondo con rayos ================= */
const sky = $("#sky"), ctx = sky.getContext("2d");
function sizeSky(){ const d = Math.min(2, devicePixelRatio || 1); sky.width = innerWidth*d; sky.height = innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
sizeSky(); addEventListener("resize", sizeSky);
function boltPath(x, y, len, ang, depth){
  const pts = [[x,y]]; let cx = x, cy = y;
  const n = 10 + Math.random()*6;
  for (let i=0;i<n;i++) { cx += Math.cos(ang)*len/n + (Math.random()-.5)*28; cy += Math.sin(ang)*len/n + (Math.random()-.5)*10; pts.push([cx,cy]); }
  const out = [pts];
  if (depth < 2) for (let i=2;i<pts.length-2;i+=3) if (Math.random() < .35) out.push(...boltPath(pts[i][0], pts[i][1], len*.4, ang + (Math.random()-.5)*1.4, depth+1));
  return out;
}
function bolt(strong){
  if (RM || document.hidden) return;
  const W = innerWidth, H = innerHeight, side = Math.random() < .5;
  const paths = boltPath(side ? Math.random()*W*.3 : W*.7 + Math.random()*W*.3, -10, H*(.35 + Math.random()*.35), Math.PI/2 + (side ? .35 : -.35), 0);
  const t0 = performance.now(), dur = strong ? 700 : 480;
  const draw = t => {
    const p = (t - t0)/dur; ctx.clearRect(0,0,W,H); if (p >= 1) return;
    const a = (p < .1 ? 1 : p < .2 ? .3 : p < .3 ? .9 : 1 - p) * (strong ? 1 : .55);
    ctx.save(); ctx.globalAlpha = Math.max(0,a); ctx.strokeStyle = "#CFF4FF"; ctx.shadowColor = "#43D6FF"; ctx.shadowBlur = 18; ctx.lineJoin = "round";
    paths.forEach((pts,i) => { ctx.lineWidth = i === 0 ? 2.2 : 1; ctx.beginPath(); pts.forEach(([x,y],j) => j ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke(); });
    ctx.restore(); requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}
(function loop(){ setTimeout(() => { bolt(false); loop(); }, 6000 + Math.random()*7000); })();
setInterval(() => { const el = document.getElementById("qtimer"); if (el) el.textContent = timeLeft(); }, 1000);

/* ================= fotos ================= */
async function onPhoto(file){
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 220 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth*s); cv.height = Math.round(img.naturalHeight*s);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    S.meal = S.meal || newMeal(); S.meal.thumb = cv.toDataURL("image/jpeg", .65); render();
  } catch { notify("No pude abrir esa imagen.", "bad"); } finally { URL.revokeObjectURL(url); }
}

/* ================= eventos ================= */
function syncMealInputs(){
  const sp = $("#saveplato"); if (sp && S.meal) S.meal.savePlato = sp.checked;
  const pn = $("#platoNombre"); if (pn && S.meal) S.meal.platoNombre = pn.value;
}
document.addEventListener("click", e => {
  const ovr = e.target.closest(".ov");

  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (S.view === "comer" && S.sub === "registrar") syncMealInputs();
  switch (a) {
    case "nav": S.view = v; S.confirm = null; S.pvG = null; S.pvH = null; if (v === "comer") S.sub = S.sub || "registrar"; render(); scrollTo(0,0); break;
    case "sub": S.sub = v; S.confirm = null; render(); break;
    case "day": { const k = addDays(S.date, +b.dataset.d); if (k <= todayKey()) { S.date = k; S.confirm = null; render(); } break; }
    case "onbyes": S.onb = 1; bolt(true); render(); break;
    case "psexo": document.querySelectorAll('[data-act="psexo"]').forEach(x => x.setAttribute("aria-pressed", x === b)); break;

    case "picker": S.modal = {type:"picker", q:""}; renderLayer(); setTimeout(() => $("#fq")?.focus(), 50); break;
    case "pick": { const f = foodById(b.dataset.id); if (f) { addFoodToMeal(f); S.modal = null; render(); } break; }
    case "manual": tgt().items.push({u:uid(), manual:true, nombre:"", n:{}}); render(); break;
    case "rmitem": { const T = tgt(); T.items = T.items.filter(x => x.u !== b.dataset.u); render(); break; }
    case "gstep": { const it = tgt().items.find(x => x.u === b.dataset.u); if (!it) break; const step = num(it.g) >= 100 ? 10 : 5; it.g = Math.max(0, r1(num(it.g) + step * +b.dataset.d));
      const inp = document.querySelector(`[data-g="${it.u}"]`); if (inp) inp.value = r1(it.g); refreshMeal(it.u); break; }
    case "por": { const it = tgt().items.find(x => x.u === b.dataset.u); if (!it) break; const g = num(b.dataset.g);
      it.g = g;
      const inp = document.querySelector(`[data-g="${it.u}"]`); if (inp) inp.value = r1(it.g); refreshMeal(it.u); break; }
    case "cam": $("#camIn").click(); break;
    case "gal": $("#galIn").click(); break;
    case "nophoto": S.meal.thumb = null; render(); break;
    case "mealreset": S.meal = null; render(); break;
    case "mealsave": saveMeal(); break;
    case "useplato": usePlato(b.dataset.id); break;
    case "newrec": S.receta = {id:null, nombre:"", items:[], pesoFinal:"", raciones:""}; S.sub = "recetas"; render(); break;
    case "editrec": editReceta(b.dataset.id); break;
    case "recsave": saveReceta(); break;
    case "recreset": S.receta = null; S.confirm = null; render(); break;
    case "recdel": { const id = S.receta && S.receta.id; if (id) { S.despensa.items = S.despensa.items.filter(f => f.id !== id); saveDespensa(); notify("Receta borrada"); } S.receta = null; S.confirm = null; render(); break; }
    case "askdelrec": S.confirm = "rec"; render(); break;
    case "delplato": S.platos.items = S.platos.items.filter(p => p.id !== b.dataset.id); savePlatos(); S.confirm = null; render(); break;
    /* despensa */
    case "newfood": S.confirm = null; S.modal = {type:"food", id:null, from:b.dataset.from, d:{nombre:"", unidad:"g", per100:{}, porciones:[{n:"1 ración", g:""}]}}; renderLayer(); break;
    case "editfood": { const f = foodById(b.dataset.id); if (!f) break; S.confirm = null; S.modal = {type:"food", id:f.id, d:{nombre:f.nombre, unidad:f.unidad||"g", per100:clone(f.per100), porciones:clone(f.porciones||[])}}; renderLayer(); break; }
    case "feuni": syncFood(); S.modal.d.unidad = v; renderLayer(); break;
    case "feadd": syncFood(); S.modal.d.porciones.push({n:"", g:""}); renderLayer(); break;
    case "ferm": syncFood(); S.modal.d.porciones.splice(+b.dataset.i, 1); renderLayer(); break;
    case "fesave": saveFood(); break;
    case "askdelfood": syncFood(); S.confirm = "food"; renderLayer(); break;
    case "fedel": S.despensa.items = S.despensa.items.filter(f => f.id !== S.modal.id); saveDespensa(); S.modal = null; S.confirm = null; notify("Alimento borrado"); render(); break;
    case "starter": { const before = snapshotProgress();
      for (const [n,u,p,por] of STARTER) S.despensa.items.push({id:uid(), nombre:n, unidad:u, per100:{...p}, porciones:por.map(([pn,g]) => ({n:pn, g})), usos:0});
      saveDespensa(); notify("14 alimentos añadidos. Revisa que coinciden con tus envases."); afterChange(before); render(); break; }
    case "closemodal": if (ovr && e.target !== ovr && !b.matches("button")) break;
      S.modal = S.notices.shift() || null; S.confirm = S.confirm === "food" ? null : S.confirm; render(); break;
    /* entreno */
    case "wstep": { const w = S.wk, i = $("#wmin"); w.min = Math.max(5, Math.round(num(i ? i.value : w.min)) + +b.dataset.d); if (i) i.value = w.min; break; }
    case "wint": S.wk.act = +$("#wact").value; S.wk.min = Math.round(num($("#wmin").value)) || S.wk.min; S.wk.intensidad = v; render(); break;
    case "wadd": { const w = S.wk, x = MET[+$("#wact").value], min = Math.max(1, Math.round(num($("#wmin").value)));
      w.act = +$("#wact").value; w.min = min; const met = r1(x.met * INT[w.intensidad].m);
      w.bloques.push({nombre:x.n, minutos:min, met, tipo:x.tipo, int:w.intensidad, kcal:kcalOf(met, min)}); render(); break; }
    case "wdel": S.wk.bloques.splice(+b.dataset.i, 1); render(); break;
    case "wreset": S.wk = null; render(); break;
    case "wsave": saveWorkout(); break;
    /* inicio */
    case "regla": { const before = snapshotProgress(); const d = dayDoc(S.date); d.reglas = d.reglas || {}; d.reglas[b.dataset.id] = !d.reglas[b.dataset.id]; saveDay(S.date); afterChange(before); render(); break; }
    case "askdel": S.confirm = b.dataset.id; render(); break;
    case "nodel": S.confirm = null; render(); break;
    case "delmeal": case "delwk": { const d = S.days[S.date]; if (!d) break; const f = a === "delmeal" ? "comidas" : "entrenos";
      d[f] = d[f].filter(x => x.id !== b.dataset.id); S.confirm = null; saveDay(S.date);
      const L = progress().L; if (S.profile.lastLevel !== L) { S.profile.lastLevel = L; saveProfile(); } render(); break; }
    /* nivel */
    case "tema": S.profile.tema = v; saveProfile(); render(); break;
    case "setimg": S.imgKey = b.dataset.k; $("#imgIn").click(); break;
    case "pv": { const i = +b.dataset.i; if (b.dataset.t === "g") S.pvG = S.pvG === i ? null : i; else S.pvH = S.pvH === i ? null : i; render(); scrollTo({top:0, behavior: RM ? "auto" : "smooth"}); break; }
    case "pvoff": S.pvG = null; S.pvH = null; render(); break;
    case "rmimg": { const k = b.dataset.k; delete S.imgs[k]; if (S.mode === "cloud") persist("img-" + k, null); else saveImgLocal(k, null); render(); break; }
    /* dieta */
    case "kmodo": S.dieta.kcalModo = v; if (v === "manual" && !S.dieta.kcalManual) S.dieta.kcalManual = calc(S.profile).target; saveDieta(); render(); break;
    case "addnut": { const n = $("#nn").value.trim(), u = $("#nu").value.trim() || "g"; if (!n) { notify("Escribe el nombre del límite.", "bad"); break; }
      const k = "x_" + uid(); S.dieta.extras = (S.dieta.extras||[]).concat({k, n:n.slice(0,20), u:u.slice(0,6)}); S.dieta.limites[k] = {v:0, t:"max", on:true}; saveDieta(); render(); notify(`Límite «${n}» añadido. Ponle su valor.`); break; }
    case "delnut": { const k = b.dataset.k; S.dieta.extras = (S.dieta.extras||[]).filter(x => x.k !== k); delete S.dieta.limites[k]; saveDieta(); render(); break; }
    case "addregla": { const t = $("#nr").value.trim(); if (!t) break; S.dieta.reglas = (S.dieta.reglas||[]).concat({id:uid(), t:t.slice(0,80)}); saveDieta(); render(); break; }
    case "delregla": S.dieta.reglas = S.dieta.reglas.filter(r => r.id !== b.dataset.id); saveDieta(); render(); break;
    /* perfil */
    case "askreset": S.confirm = "reset"; render(); break;
    case "export": exportData(); break;
    case "import": $("#bkIn").click(); break;
    case "importno": S.pendingImport = null; render(); break;
    case "importyes": applyBackup(); break;
    case "doreset": { const keys = Object.keys(S.days);
      if (S.mode === "cloud") { keys.forEach(k => persist("d-"+k, null)); ["profile","dieta","despensa","platos"].forEach(id => persist(id, null)); Object.keys(S.imgs).forEach(k => persist("img-" + k, null)); }
      else { Object.keys(S.imgs).forEach(k => saveImgLocal(k, null)); try { localStorage.removeItem(LS); } catch {} }
      Object.assign(S, {profile:null, dieta:null, despensa:{items:[]}, platos:{items:[]}, days:{}, imgs:{}, receta:null, confirm:null, onb:0, view:"inicio", meal:null, wk:null});
      saveLocal(); render(); break; }
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "pf") return; e.preventDefault();
  const nuevo = !S.profile || !S.profile.accepted, p = readProfile();
  if (!p) { notify("Revisa edad, altura y peso.", "bad"); return; }
  if (nuevo) { p.accepted = true; p.creado = todayKey(); p.lastLevel = 1; p.tema = "cazador"; }
  S.profile = p; saveProfile();
  if (!S.dieta) { S.dieta = newDieta(p); saveDieta(); }
  else if (S.dieta.kcalModo !== "manual") { S.dieta.limites.kcal.v = calc(p).target; saveDieta(); }
  if (nuevo) { S.view = "inicio"; notify("Misión diaria desbloqueada"); bolt(true); } else notify("Perfil guardado");
  render();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "camIn" || t.id === "galIn") { onPhoto(t.files && t.files[0]); t.value = ""; return; }
  if (t.id === "imgIn") { onCharImg(t.files && t.files[0]); t.value = ""; return; }
  if (t.id === "bkIn") { readBackup(t.files && t.files[0]); t.value = ""; return; }
  if (t.id === "saveplato") { S.meal.savePlato = t.checked; render(); return; }
  if (t.id === "wact") { S.wk.act = +t.value; return; }
  if (t.id === "wmin") { S.wk.min = Math.max(1, Math.round(num(t.value))); return; }
  if (t.id === "d-notas") { S.dieta.notas = t.value.slice(0,4000); saveDieta(); notify("Dieta guardada"); return; }
  if (t.id === "d-kcal") { S.dieta.kcalManual = Math.max(800, Math.round(num(t.value))); S.dieta.limites.kcal.v = S.dieta.kcalManual; saveDieta(); render(); return; }

  if (t.dataset.lon) { const L = S.dieta.limites[t.dataset.lon] || (S.dieta.limites[t.dataset.lon] = {v:0,t:"max",on:false}); L.on = t.checked; saveDieta(); return; }
  if (t.dataset.lt) { S.dieta.limites[t.dataset.lt].t = t.value; saveDieta(); return; }
  if (t.dataset.lv) { S.dieta.limites[t.dataset.lv].v = r1(num(t.value)); saveDieta(); return; }
  if (t.dataset.g) { const it = tgt().items.find(x => x.u === t.dataset.g); if (it) { it.g = Math.max(0, r1(num(t.value))); t.value = r1(it.g); refreshMeal(it.u); } return; }
});
document.addEventListener("input", e => {
